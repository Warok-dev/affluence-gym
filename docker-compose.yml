# Local stack identical to production: PostgreSQL + API + PWA served by nginx.
#   docker compose up --build      ->  http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: affluence
      POSTGRES_PASSWORD: affluence # local only
      POSTGRES_DB: affluence
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affluence"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://affluence:affluence@db:5432/affluence
      ALLOWED_ORIGINS: http://localhost:8080
      TIMEZONE: America/Toronto
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_UPSTREAM: http://backend:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
