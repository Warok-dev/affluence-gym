# Render Blueprint: https://render.com/docs/blueprint-spec
# Free API (Docker) + free static site. The database is a free Neon PostgreSQL
# (Render's free Postgres expires after 30 days): paste its URL in DATABASE_URL.
# Both services redeploy automatically once GitHub checks (CI) pass on main.
services:
  - type: web
    name: affluence-gym-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths: ["backend/**"]
    envVars:
      - key: DATABASE_URL
        sync: false # secret: Neon connection string, set in the dashboard
      - key: ALLOWED_ORIGINS
        value: https://affluence-gym.onrender.com # URL of the static site below
      - key: TIMEZONE
        value: America/Toronto

  - type: web
    name: affluence-gym
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths: ["frontend/**"]
    envVars:
      - key: VITE_API_URL
        value: https://affluence-gym-api.onrender.com # URL of the API above
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
