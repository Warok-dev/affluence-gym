# Render Blueprint: https://render.com/docs/blueprint-spec
# Free API (Docker) + free static site. The database is a free Neon PostgreSQL
# (Render's free Postgres expires after 30 days): paste its URL in DATABASE_URL.
# Both services redeploy automatically once GitHub checks (CI) pass on main.
services:
  - type: web
    name: affluence-gym-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths: ["backend/**"]
    envVars:
      - key: DATABASE_URL
        sync: false # secret: Neon connection string, set in the dashboard
      - key: ALLOWED_ORIGINS
        value: https://affluence-gym.onrender.com # URL of the static site below
      - key: TIMEZONE
        value: America/Toronto
      - key: VAPID_PUBLIC_KEY
        sync: false # Web Push keys (scripts/generate_vapid_keys.py)
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false # mailto:<contact>
      - key: OFFICIAL_API_KEY
        sync: false # secret shared with the university's counter system (leave empty until then)

  - type: web
    name: affluence-gym
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths: ["frontend/**"]
    envVars:
      - key: VITE_API_URL
        value: https://affluence-gym-api.onrender.com # URL of the API above
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Security headers (same as frontend/security-headers.conf and `npm run preview`).
      # connect-src must list the API's URL (VITE_API_URL above).
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://affluence-gym-api.onrender.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
