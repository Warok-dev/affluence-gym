# Alembic configuration. The database URL comes from app.config (DATABASE_URL / DB_PATH).
# Usage (from backend/):  .venv\Scripts\python -m alembic upgrade head
#                         .venv\Scripts\python -m alembic revision --autogenerate -m "message"
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
